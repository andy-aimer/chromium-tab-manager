<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heaps O' Tabs</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <section>
      <div class="section-toolbar">
        <div class="header-left">
          <h2>Active Windows</h2>
          <span id="active-count" class="meta"></span>
        </div>

        <div class="header-center">
          <button id="undo-btn" class="icon-button" aria-label="Undo">↩</button>
          <button id="redo-btn" class="icon-button" aria-label="Redo">↪</button>
        </div>

        <div class="actions">
          <button id="save-markdown-btn" class="icon-button" aria-label="Save Markdown">📥</button>
          <button id="close-tabs-btn" class="icon-button danger" aria-label="Close Selected Tabs">🗑️</button>
          <div class="divider-v"></div>
          <label class="trace-toggle">
            <input id="trace-history" type="checkbox" />
            History
          </label>
          <button id="refresh-btn">Refresh</button>

          <button id="minimize-all-btn">Minimize All</button>
          <button id="expand-all-btn">Expand All</button>
          <button id="save-session-btn">Sessions</button>
          <button id="save-all-btn" class="primary">Export All</button>
          <label class="column-picker">Columns
            <select id="column-count">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>
        </div>
        <!-- Settings Modal -->
        <div id="settings-modal" class="modal-overlay" hidden>
          <div class="modal">
            <div class="modal-body">
              <div class="form-group">
                <label for="undo-limit-input" class="has-tooltip">
                  Undo/Redo History Limit:
                  <span class="tooltip">Maximum number of actions to store (3-100).</span>
                </label>
                <input type="number" id="undo-limit-input" min="3" max="100" step="1" value="50">
              </div>
              <div class="form-group checkbox-group">
                <input type="checkbox" id="show-card-meta-input">
                <label for="show-card-meta-input">Show Window Order Numbers</label>
              </div>
              <button id="save-settings-btn" class="primary">Save</button>
            </div>
          </div>
        </div>

        <button id="settings-btn" class="icon-button" aria-label="Settings">⚙️</button>
      </div>

      <!-- Toast Notification Area -->
      <div id="toast-notification" class="toast hidden"></div>


      <div id="active-list" class="list card-columns"></div>
    </section>

  </main>



  <template id="window-template">
    <article class="card">
      <div class="card-meta">
        <!-- Moved order key -->
      </div>
      <div class="card-header">
        <div class="toggle-wrapper">
          <button class="toggle-tabs toggle-tabs-left" aria-label="Toggle tabs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>
          <div class="card-order-key"></div>
          <label class="interactive-toggle" title="Toggle Interactive Mode">
            <input type="checkbox" class="interactive-checkbox">
            <span class="toggle-icon">
              <!-- Default closed (read-only) -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
              </svg>
            </span>
          </label>
        </div>
      </div>
      <div class="card-title">
        <h3 class="title"></h3>
        <p class="meta text-sm"></p>
      </div>
      <div class="card-actions">

      </div>
      <button class="toggle-tabs toggle-tabs-right" aria-label="Toggle tabs">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </button>
      </div>
      <div class="tab-list"></div>
    </article>
  </template>

  <div id="context-menu"></div>
  <div id="toast-container"></div>
  <dialog id="sessions-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Saved Sessions</h3>
        <button id="close-sessions-btn" class="icon-button close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="new-session-form">
          <input type="text" id="new-session-name" placeholder="Enter session name..." />
          <button id="save-current-session-btn" class="primary">Save Current State</button>
        </div>
        <div class="divider"></div>
        <div id="session-list" class="session-list">
          <!-- Session items will be injected here -->
          <div class="empty-state">No saved sessions found.</div>
        </div>
      </div>
    </div>
  </dialog>

  <template id="session-item-template">
    <div class="session-item">
      <div class="session-info">
        <div class="session-name-row">
          <span class="session-name">Work Setup</span>
          <button class="icon-button small edit-name-btn" title="Rename">✎</button>
        </div>
        <div class="session-meta">
          <span class="session-date">Jan 12, 10:30 AM</span> •
          <span class="session-count">3 Windows, 14 Tabs</span>
        </div>
      </div>
      <div class="session-actions">
        <button class="load-session-btn">Restores</button>
        <button class="icon-button danger delete-session-btn" title="Delete">🗑️</button>
      </div>
    </div>
  </template>

  <script src="manager.js" type="module"></script>
</body>

</html>
