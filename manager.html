<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <section>
      <div class="section-toolbar">
        <div class="header-left">
          <h2>Active Windows</h2>
          <span id="active-count" class="meta"></span>
        </div>

        <div class="header-center">
          <button id="undo-btn" class="icon-button" aria-label="Undo">↩</button>
          <button id="redo-btn" class="icon-button" aria-label="Redo">↪</button>
        </div>

        <div class="actions">
          <button id="save-markdown-btn" class="icon-button" aria-label="Save Markdown">📥</button>
          <button id="close-tabs-btn" class="icon-button danger" aria-label="Close Selected Tabs">🗑️</button>
          <div class="divider-v"></div>
          <label class="trace-toggle">
            <input id="trace-history" type="checkbox" />
            History
          </label>
          <button id="refresh-btn">Refresh</button>

          <button id="minimize-all-btn">Minimize All</button>
          <button id="expand-all-btn">Expand All</button>
          <button id="save-session-btn">Export Selected</button>
          <button id="save-all-btn" class="primary">Export All</button>
          <label class="column-picker">Columns
            <select id="column-count">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>
        </div>
        <!-- Settings Modal -->
        <div id="settings-modal" class="modal-overlay" hidden>
          <div class="modal">
            <div class="modal-body">
              <div class="form-group">
                <label for="undo-limit-input" class="has-tooltip">
                  Undo/Redo History Limit:
                  <span class="tooltip">Maximum number of actions to store (10-1000).</span>
                </label>
                <input type="number" id="undo-limit-input" min="10" max="1000" step="10" value="50">
              </div>
              <div class="form-group checkbox-group">
                <input type="checkbox" id="show-card-meta-input">
                <label for="show-card-meta-input">Show Window Order Numbers</label>
              </div>
              <button id="save-settings-btn" class="primary">Save</button>
            </div>

          </div>
        </div>
      </div>
      <button id="settings-btn" class="icon-button" aria-label="Settings">⚙️</button>
      </div>

      <div id="active-list" class="list card-columns"></div>
    </section>

  </main>



  <template id="window-template">
    <article class="card">
      <div class="card-meta">
        <div class="card-order-key"></div>
      </div>
      <div class="card-header">
        <button class="toggle-tabs toggle-tabs-left" aria-label="Toggle tabs">▴</button>

        <div class="card-title">
          <h3 class="title"></h3>
          <p class="meta text-sm"></p>
        </div>
        <div class="card-actions"></div>
        <button class="toggle-tabs toggle-tabs-right" aria-label="Toggle tabs">▾</button>
      </div>
      <div class="tab-list"></div>
    </article>
  </template>

  <div id="context-menu"></div>
  <script src="manager.js" type="module"></script>
</body>

</html>
