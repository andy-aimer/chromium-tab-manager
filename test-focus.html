<!DOCTYPE html>
<html>
<head>
    <title>Window Focus Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .test-card {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 20px;
            background-color: #f5f5f5;
            transition: all 0.3s ease;
        }
        .test-card.window-focused {
            background-color: #FFFFFF;
            border: 2px solid #2563eb;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }
        button {
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>
    <h1>Window Focus Test</h1>
    <div class="test-container">
        <div class="test-card" id="card1">
            <h3>Window 1</h3>
            <p>This card represents a focused window</p>
        </div>
        <div class="test-card" id="card2">
            <h3>Window 2</h3>
            <p>This card represents an unfocused window</p>
        </div>
        <div class="test-card" id="card3">
            <h3>Window 3</h3>
            <p>This card represents an unfocused window</p>
        </div>
    </div>
    <div style="margin-top: 20px;">
        <button onclick="focusWindow(1)">Focus Window 1</button>
        <button onclick="focusWindow(2)">Focus Window 2</button>
        <button onclick="focusWindow(3)">Focus Window 3</button>
    </div>
    
    <script>
        function focusWindow(windowId) {
            // Remove focus from all cards
            document.querySelectorAll('.test-card').forEach(card => {
                card.classList.remove('window-focused');
            });
            
            // Add focus to the selected card
            const focusedCard = document.getElementById(`card${windowId}`);
            if (focusedCard) {
                focusedCard.classList.add('window-focused');
            }
        }
        
        // Simulate initial focus on window 1
        focusWindow(1);
    </script>
</body>
</html>
